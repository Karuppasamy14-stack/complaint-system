<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #141e30;
    color: white;
}

.sidebar {
    height: 100vh;
    width: 220px;
    position: fixed;
    background: #1e1e2f;
    padding-top: 20px;
}

.sidebar h3 {
    text-align: center;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    padding: 12px;
    color: white;
    text-decoration: none;
}

.sidebar a:hover {
    background: #ffc107;
    color: black;
}

.content {
    margin-left: 230px;
    padding: 20px;
}

.card-box {
    background: #1e1e2f;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

.issue {
    color: #ffc107;
    font-weight: bold;
    font-size: 18px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h3>Admin</h3>
    <a href="/admin">Dashboard</a>
    <a href="/admin">Complaints</a>
    <a href="/logout">Logout</a>
</div>

<!-- CONTENT -->
<div class="content">

<h2>Admin Panel</h2>

<!-- FILTER -->
<div class="mb-3">
<button onclick="filterStatus('All')" class="btn btn-light">All</button>
<button onclick="filterStatus('Pending')" class="btn btn-warning">Pending</button>
<button onclick="filterStatus('In Progress')" class="btn btn-info">In Progress</button>
<button onclick="filterStatus('Resolved')" class="btn btn-success">Resolved</button>
</div>

{% for c in data %}

<div class="card-box" data-status="{{c[3]}}">

<div class="row">

<div class="col-md-8">

<p class="issue">
🧾 {{ c[2] if c[2] else "No issue provided" }}
</p>

<p>👤 {{ c[1] }}</p>
<p>Status: {{ c[3] }}</p>

<!-- 🔔 NOTIFICATION -->
<p style="color:lightgreen;">🔔 {{ c[6] }}</p>

<form method="POST">
<input type="hidden" name="id" value="{{c[0]}}">
<input name="staff" class="form-control mb-2" placeholder="Assign staff">
<button class="btn btn-warning w-100">Assign</button>
</form>

</div>

<div class="col-md-4">
{% if c[5] %}
<img src="/static/uploads/{{c[5]}}" class="img-fluid rounded">
{% endif %}
</div>

</div>

</div>

{% endfor %}

</div>

<script>
function filterStatus(status) {
    let cards = document.querySelectorAll(".card-box");

    cards.forEach(card => {
        if (status === "All" || card.getAttribute("data-status") === status) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
</html>
