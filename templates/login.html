<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.login-box {
    width: 90%;
    max-width: 320px;
    padding: 25px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color: white;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 5px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #00ffcc;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login 🔐</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
