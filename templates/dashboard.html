<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    color: white;
    font-family: Arial;
}

/* Title */
h2 {
    font-weight: bold;
}

/* Cards */
.card-box {
    background: #1e1e2f;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

/* Floating Button */
.floating-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #00c853;
    color: white;
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

/* Chart size */
.chart-container {
    height: 300px;
}
</style>

</head>

<body>

<div class="container p-3">

<h2>📊 Dashboard</h2>

<div class="row mt-3 g-3">

<div class="col-6 col-md-3">
<div class="card-box">
<h6>Total</h6>
<h3>{{ total }}</h3>
</div>
</div>

<div class="col-6 col-md-3">
<div class="card-box">
<h6>Pending</h6>
<h3>{{ pending }}</h3>
</div>
</div>

<div class="col-6 col-md-3">
<div class="card-box">
<h6>In Progress</h6>
<h3>{{ progress }}</h3>
</div>
</div>

<div class="col-6 col-md-3">
<div class="card-box">
<h6>Resolved</h6>
<h3>{{ resolved }}</h3>
</div>
</div>

</div>

<!-- Chart -->
<div class="chart-container mt-4">
<canvas id="myChart"></canvas>
</div>

</div>

<!-- FLOATING BUTTON -->
<a href="/complaint">
    <button class="floating-btn">+</button>
</a>

<script>
window.onload = function() {

    const total = Number("{{ total }}") || 0;
    const pending = Number("{{ pending }}") || 0;
    const progress = Number("{{ progress }}") || 0;
    const resolved = Number("{{ resolved }}") || 0;

    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Total', 'Pending', 'Progress', 'Resolved'],
            datasets: [{
                label: 'Complaints',
                data: [total, pending, progress, resolved]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

};
</script>

</body>
</html>
