<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
}

/* Cards */
.card-box {
    background: #1e1e2f;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 15px;
}

/* Mobile spacing */
@media (max-width: 768px) {
    h2 {
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="container-fluid p-3">

<h2>📊 Dashboard</h2>

<!-- RESPONSIVE GRID -->
<div class="row g-3 mt-2">

<div class="col-6 col-md-3">
<div class="card-box">
<h6>Total</h6>
<h3>{{ total }}</h3>
</div>
</div>

<div class="col-6 col-md-3">
<div class="card-box">
<h6>Pending</h6>
<h3>{{ pending }}</h3>
</div>
</div>

<div class="col-6 col-md-3">
<div class="card-box">
<h6>In Progress</h6>
<h3>{{ progress }}</h3>
</div>
</div>

<div class="col-6 col-md-3">
<div class="card-box">
<h6>Resolved</h6>
<h3>{{ resolved }}</h3>
</div>
</div>

</div>

<!-- CHART -->
<div class="mt-4" style="height:300px;">
<canvas id="myChart"></canvas>
</div>

</div>

<script>
window.onload = function() {

    const total = Number("{{ total }}") || 0;
    const pending = Number("{{ pending }}") || 0;
    const progress = Number("{{ progress }}") || 0;
    const resolved = Number("{{ resolved }}") || 0;

    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Total', 'Pending', 'Progress', 'Resolved'],
            datasets: [{
                label: 'Complaints',
                data: [total, pending, progress, resolved]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

};
</script>

</body>
</html>
